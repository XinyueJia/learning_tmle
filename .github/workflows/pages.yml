name: Publish Learning TMLE to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build both editions
        run: pnpm run build
      - name: Check the Pages artifact
        run: pnpm run check:pages
      - name: Run numerical and content tests
        run: pnpm test
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check repository-prefix navigation and lazy loading
        run: pnpm run test:browser:pages
        env:
          EIF_BROWSER_CHANNEL: chromium
      - name: Check the English course and bilingual links
        run: pnpm run test:browser:en
        env:
          EIF_BROWSER_CHANNEL: chromium
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the built site
        id: deployment
        uses: actions/deploy-pages@v4
